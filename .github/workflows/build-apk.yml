# Wamagotchi 테스트 APK 자동 빌드
#
# wamagotchi/ 코드가 이 브랜치에 푸시될 때마다:
#   정적 분석 → 단위 테스트 → 릴리스 APK 빌드 → 'wamagotchi-test' 릴리스에 첨부
# 스마트폰에서 릴리스 페이지를 열어 APK를 내려받아 설치하면 된다.
name: Wamagotchi APK

on:
  push:
    branches: [claude/text-echo-pet-rpg-vvdxjp]
    paths:
      - 'wamagotchi/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wamagotchi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 안드로이드 플랫폼 폴더 생성 (저장소에는 Dart 코드만 있음)
        run: |
          flutter create --org com.oldtower --project-name wamagotchi --platforms android .
          # flutter create가 만드는 기본 카운터앱 테스트는 이 앱과 무관하므로 제거
          rm -f test/widget_test.dart

      - name: 의존성 설치
        run: flutter pub get

      # 매 빌드 같은 키로 서명해야 폰에서 '업데이트 설치'가 된다.
      # 최초 1회 키를 만들어 릴리스에 보관하고, 이후 빌드는 그 키를 재사용한다.
      # (테스트 전용 키 — 실제 스토어 출시 때는 별도의 비공개 키를 쓴다)
      - name: 고정 서명 키 준비
        run: |
          mkdir -p ~/.android
          if curl -fsSL -o ~/.android/debug.keystore \
            "https://github.com/${{ github.repository }}/releases/download/wamagotchi-test/debug.keystore"; then
            echo "기존 서명 키 재사용"
          else
            echo "서명 키가 없어 새로 생성 (최초 1회)"
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Wamagotchi Test, O=OldTower, C=KR"
          fi

      - name: 정적 분석 (오류만 실패 처리)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 단위 테스트
        run: flutter test

      - name: 릴리스 APK 빌드 (빌드 번호 자동 증가 → 업데이트 설치 가능)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: 릴리스 첨부 파일 준비
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk wamagotchi-test.apk
          cp ~/.android/debug.keystore debug.keystore

      - name: 테스트 릴리스에 APK 첨부
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wamagotchi-test
          name: Wamagotchi 테스트 빌드
          prerelease: true
          body: |
            📱 처음 설치
            1. 폰 브라우저로 이 페이지를 열고 아래 wamagotchi-test.apk를 내려받기
            2. 다운로드 알림(또는 내 파일 앱)에서 APK를 탭
            3. "출처를 알 수 없는 앱 설치" 허용 → 설치
            4. Play 프로텍트 경고가 나오면 "무시하고 설치" (테스트 빌드라 정상)

            🔄 업데이트
            같은 방법으로 새 APK를 받아 설치하면 기존 앱 위에 업데이트됩니다.
            메모·정령 데이터는 그대로 유지됩니다.

            이 릴리스는 브랜치에 푸시될 때마다 최신 빌드로 갱신됩니다.
            (debug.keystore는 빌드 서명 유지용 테스트 키 — 내려받을 필요 없음)
          files: |
            wamagotchi/wamagotchi-test.apk
            wamagotchi/debug.keystore
